apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The non-Helm half of the optional otel-collection bundle (see ../README.md).
# No namespace: field -- these objects live in otel-collection and
# huemie-local, so each sets its own.
resources:
  - namespace.yaml
  - telemetry-env.yaml
  - network-policies.yaml
