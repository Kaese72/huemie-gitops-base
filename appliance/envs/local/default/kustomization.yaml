apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: huemie-local

configMapGenerator:
- name: cloud-connect-configmap
  literals:
    - database.host=mariadb
    - database.user=user
    - appliance-registry.base-url=https://cloud.humi.kaese.space
    - cloud.enroll-base-url=https://cloud.humi.kaese.space/enroll
    - tunnel.allowed-host-pattern=app\.huemie\.local
    - tunnel.local-ingress=traefik.kube-system.svc.cluster.local:80
- name: adapter-attendant-configmap
  literals:
    - adapter.namespace=adapters
    - adapters.device-store-url=http://device-store.huemie-local:8080
    - database.host=mariadb
    - database.user=user
- name: authentication-configmap
  literals:
    - database.host=mariadb
    - database.user=user
- name: device-store-configmap
  literals:
    - database.host=mariadb
    - database.user=user
- name: ittt-orchestrator-configmap
  literals:
    - database.host=mariadb
    - database.user=user
- name: chatbot-configmap
  literals:
    - database.host=mariadb
    - database.user=user
    - device-store.url=http://device-store.huemie-local:8080
    - anthropic.model=claude-haiku-4-5-20251001
    - authentication.url=http://authentication.huemie-local:8080

secretGenerator:
- name: cloud-connect-client-secret
  literals:
    - database.password=databaseuserpassword
- name: adapter-attendant-secret
  literals:
    - database.password=databaseuserpassword
- name: authentication-secret
  literals:
    - database.password=databaseuserpassword
    - auth.refresh-secret=supersecretrefreshsecret
- name: device-store-secret
  literals:
    - database.password=databaseuserpassword
    - database.event.connectionstring=amqp://guest:guest@rabbitmq-headless:5672/
- name: ittt-orchestrator-secret
  literals:
    - database.password=databaseuserpassword
    - event.connectionstring=amqp://guest:guest@rabbitmq-headless:5672/
- name: chatbot-secret
  literals:
    # Real, working local values -- same shared MariaDB/RabbitMQ every
    # other service in this overlay uses.
    - database.password=databaseuserpassword
    - event.connectionstring=amqp://guest:guest@rabbitmq-headless:5672/
    # Neither the Anthropic API key nor the device-store credential is
    # deploy-time config: once chatbot is running, add an Anthropic key via
    # POST /chatbot-service/v0/api-keys, and set up its own device-store
    # identity via POST /chatbot-service/v0/identities/setup.

resources:
 - namespace.yaml
 - ../../../base/default
 - ../../../base/cloud-connect-client
 - ../3pp
