apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: huemie-local

# Stable, unhashed names: mariadb-db-users-bootstrap and
# rabbitmq-users-bootstrap (see ../../../base/default) patch per-service
# credentials into these Secrets by their literal name via plain kubectl
# commands, which have no visibility into kustomize's generated name-suffix
# hash. Same reasoning as cloud/envs/hallen/kustomization.yaml.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: cloud-connect-configmap
  literals:
    - database.host=mariadb
    - database.user=cloudconnectclient
    - appliance-registry.base-url=https://cloud.humi.kaese.space
    - cloud.enroll-base-url=https://cloud.humi.kaese.space/enroll
    - cloud.login-base-url=https://cloud.humi.kaese.space/appliance-login
    - tunnel.allowed-host-pattern=app\.huemie\.local
    - tunnel.local-ingress=traefik.kube-system.svc.cluster.local:80
- name: adapter-attendant-configmap
  literals:
    - adapter.namespace=adapters
    - adapters.device-store-url=http://device-store.huemie-local:8080
    - database.host=mariadb
    - database.user=adapterattendant
- name: authentication-configmap
  literals:
    - database.host=mariadb
    - database.user=authentication
    - cloud.connect-client-url=http://cloud-connect-client.huemie-local:8081
    - internal.token-audience=humi-authentication-internal
- name: device-store-configmap
  literals:
    - database.host=mariadb
    - database.user=devicestore
- name: ittt-orchestrator-configmap
  literals:
    - database.host=mariadb
    - database.user=itttorchestrator
- name: chatbot-configmap
  literals:
    - database.host=mariadb
    - database.user=chatbot
    - device-store.url=http://device-store.huemie-local:8080
    - anthropic.model=claude-haiku-4-5-20251001
    - authentication.internal-url=http://authentication.huemie-local:8081

# Per-service database.password/event.connectionstring/auth.refresh-secret
# values are generated and patched into these same Secrets by
# mariadb-db-users-bootstrap, rabbitmq-users-bootstrap and
# auth-refresh-secret-bootstrap (../../../base/default), not listed here.
secretGenerator:
- name: chatbot-secret
  literals:
    # The Anthropic API key is not deploy-time config: once chatbot is
    # running, add one via POST /chatbot-service/v0/api-keys. There is no
    # device-store credential to configure -- the chatbot impersonates
    # whichever user is driving the conversation (see internal/serviceauth).
    - placeholder=unused
    # ^ secretGenerator needs at least one literal; this key is never read
    # by anything. Remove it if chatbot-secret ever gets a real static
    # literal of its own again.

resources:
 - namespace.yaml
 - ../../../base/default
 - ../../../base/cloud-connect-client
 - ../3pp
