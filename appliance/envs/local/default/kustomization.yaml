apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: huemie-local

configMapGenerator:
- name: cloud-connect-configmap
  literals:
    - server.url=https://apartment.humi.kaese.space/cloud-connect/v0/tunnel
    - allowed.host.pattern=app\.huemie\.local
    - local.ingress=traefik.kube-system.svc.cluster.local:80
- name: adapter-attendant-configmap
  literals:
    - adapter.namespace=adapters
    - adapters.device-store-url=http://device-store.huemie-local:8080
    - database.host=mariadb
    - database.user=user
- name: authentication-configmap
  literals:
    - database.host=mariadb
    - database.user=user
- name: device-store-configmap
  literals:
    - database.host=mariadb
    - database.user=user
- name: ittt-orchestrator-configmap
  literals:
    - database.host=mariadb
    - database.user=user
- name: chatbot-configmap
  literals:
    - database.host=mariadb
    - database.user=user
    - device-store.url=http://device-store.huemie-local:8080
    - anthropic.model=claude-opus-5

secretGenerator:
- name: adapter-attendant-secret
  literals:
    - database.password=databaseuserpassword
- name: authentication-secret
  literals:
    - database.password=databaseuserpassword
    - auth.refresh-secret=supersecretrefreshsecret
- name: device-store-secret
  literals:
    - database.password=databaseuserpassword
    - database.event.connectionstring=amqp://guest:guest@rabbitmq-headless:5672/
- name: ittt-orchestrator-secret
  literals:
    - database.password=databaseuserpassword
    - event.connectionstring=amqp://guest:guest@rabbitmq-headless:5672/
- name: chatbot-secret
  literals:
    # Real, working local values -- same shared MariaDB/RabbitMQ every
    # other service in this overlay uses.
    - database.password=databaseuserpassword
    - event.connectionstring=amqp://guest:guest@rabbitmq-headless:5672/
    # Chatbot-specific secrets -- these are NOT usable as-is. Replace
    # before scaling the chatbot Deployment above 0 replicas:
    #   - device-store.jwt: a JWT for the bot's own device-store user
    #   - anthropic.api-key: a real key from console.anthropic.com
    - device-store.jwt=REPLACE_ME_DEVICE_STORE_JWT
    - anthropic.api-key=REPLACE_ME_ANTHROPIC_API_KEY

resources:
 - namespace.yaml
 - ../../../base/default
 - ../../../base/cloud-connect-client
 - ../3pp
