---
apiVersion: v1
data:
  password: bWFyaWFkYnNlY3JldHBhc3N3b3Jk
kind: Secret
metadata:
  name: mariadb-root-password
type: Opaque
---
apiVersion: v1
data:
  my.cnf: "[mysqld]\r\nbind-address = 0.0.0.0"
kind: ConfigMap
metadata:
  name: mariadb-config
---
apiVersion: v1
# init.sql only runs against a brand-new, empty data directory (standard
# mariadb image behavior) - it has no effect on the already-provisioned PVC
# this environment uses. Adding a database here documents what a fresh
# install gets; onboarding a new database onto the live instance still
# requires running its CREATE DATABASE/GRANT statements by hand once.
data:
  init.sql: |
    CREATE USER IF NOT EXISTS 'user'@'%' IDENTIFIED BY 'databaseuserpassword';
    CREATE DATABASE IF NOT EXISTS authentication;
    GRANT ALL PRIVILEGES ON authentication.* TO 'user'@'%' IDENTIFIED BY 'databaseuserpassword';
    CREATE DATABASE IF NOT EXISTS devicestore;
    GRANT ALL PRIVILEGES ON devicestore.* TO 'user'@'%' IDENTIFIED BY 'databaseuserpassword';
    CREATE DATABASE IF NOT EXISTS adapterattendant;
    GRANT ALL PRIVILEGES ON adapterattendant.* TO 'user'@'%' IDENTIFIED BY 'databaseuserpassword';
    CREATE DATABASE IF NOT EXISTS itttorchestrator;
    GRANT ALL PRIVILEGES ON itttorchestrator.* TO 'user'@'%' IDENTIFIED BY 'databaseuserpassword';
    CREATE DATABASE IF NOT EXISTS chatbot;
    GRANT ALL PRIVILEGES ON chatbot.* TO 'user'@'%' IDENTIFIED BY 'databaseuserpassword';
    CREATE DATABASE IF NOT EXISTS cloudconnectclient;
    GRANT ALL PRIVILEGES ON cloudconnectclient.* TO 'user'@'%' IDENTIFIED BY 'databaseuserpassword';
kind: ConfigMap
metadata:
  name: mariadb-init-sql
---
apiVersion: v1
metadata:
  name: mariadb-user-creds
data:
  password: ZGF0YWJhc2V1c2VycGFzc3dvcmQ=
  username: dXNlcg==
kind: Secret
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-pv-claim
  labels:
    app: mariadb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
        huemie.space/service-role: mariadb
    spec:
      containers:
      - name: mariadb
        # Pinned to match the version this instance's PVC was originally
        # initialized with (11.7.2). Was previously `mariadb:latest`, which
        # silently drifted to 12.3.2 and broke every database on this
        # instance until `mariadb-upgrade` was run by hand -- don't move
        # this forward without also running `mariadb-upgrade` against the
        # live pod (or accepting a PVC wipe) as part of the same change.
        image: mariadb:13.0.2
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: config-volume
          mountPath: /etc/mysql/conf.d/
        - name: mariadb-pv
          mountPath: /var/lib/mysql
        - name: mariadb-init-sql
          mountPath: /docker-entrypoint-initdb.d
        env:
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-root-password
              key: password
        - name: MARIADB_USER
          valueFrom:
            secretKeyRef:
              name: mariadb-user-creds
              key: username
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-user-creds
              key: password
        resources:
          limits:
            cpu: 1000m
            memory: 512M
          requests:
            cpu: 500m
            memory: 512M
      volumes:
      - name: config-volume
        configMap:
          name: mariadb-config
      - name: mariadb-pv
        persistentVolumeClaim:
          claimName: mariadb-pv-claim
      - name: mariadb-init-sql
        configMap:
          name: mariadb-init-sql
          items:
            - key: init.sql
              path: init.sql
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: mariadb
  name: mariadb
spec:
  ports:
    - port: 3306
      protocol: TCP
      targetPort: 3306
  selector:
    app: mariadb
status:
  loadBalancer: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb
spec:
  podSelector:
    matchLabels:
      huemie.space/service-role: mariadb
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              huemie.space/service-role: device-store
      ports:
        - port: 3306
    - from:
        - podSelector:
            matchLabels:
              huemie.space/service-role: adapter-attendant
      ports:
        - port: 3306
    - from:
        - podSelector:
            matchLabels:
              huemie.space/service-role: authentication
      ports:
        - port: 3306
    - from:
        - podSelector:
            matchLabels:
              huemie.space/service-role: ittt-orchestrator
      ports:
        - port: 3306
    - from:
        - podSelector:
            matchLabels:
              huemie.space/service-role: chatbot
      ports:
        - port: 3306
    - from:
        - podSelector:
            matchLabels:
              huemie.space/service-role: cloud-connect-client
      ports:
        - port: 3306
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
