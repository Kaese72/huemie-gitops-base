apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The template appliance/argocd/applicationset-adapters.yaml instantiates
# once per synced adapter in adapter-attendant. Not part of ../kustomization.yaml:
# nothing deploys it except that ApplicationSet.
#
# No namespace: field - each adapter-<id> Application's destination
# (namespace adapters) places everything.
resources:
  - adapter-instance.yaml
