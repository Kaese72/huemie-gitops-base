---
# Default deny, both directions, for every pod in adapters -- same as
# ../default/network-policies.yaml for huemie-local. Every adapter the
# adapters ApplicationSet deploys carries huemie.space/service-role: adapter
# and is governed by the adapter policy below; anything else started here
# gets no traffic at all. Waved after that policy, so the deny never lands
# before the allow on a fresh install.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: adapters
  annotations:
    argocd.argoproj.io/sync-wave: "56"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: adapter
  namespace: adapters
  annotations:
    argocd.argoproj.io/sync-wave: "55"
spec:
  podSelector:
    matchLabels:
      huemie.space/service-role: adapter
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              huemie.space/namespace-role: core
          podSelector:
            matchLabels:
              huemie.space/service-role: device-store
      ports:
        - port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              huemie.space/namespace-role: core
          podSelector:
            matchLabels:
              huemie.space/service-role: device-store
      ports:
        - port: 8080
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16
              - 10.43.0.0/16
