apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The adapters namespace, and the access adapter-attendant's plugin-token
# bootstrap needs outside huemie-local. The adapters themselves
# are deployed into this namespace by the adapters ApplicationSet
# (appliance/argocd/applicationset-adapters.yaml), from
# ../adapter-instance.
#
# No namespace: field on purpose -- these objects live in both adapters and
# argocd (and RoleBinding subjects name huemie-local), so each sets its own.
resources:
  - namespace.yaml
  - adapter-attendant-plugin-token-bootstrap.yaml
  - network-policies.yaml
