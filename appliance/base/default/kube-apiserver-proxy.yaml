---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-apiserver-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "10"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-apiserver-proxy
  annotations:
    # Same wave as the huemie-local Namespace, and before every bootstrap
    # Job (wave 20+): they reach the Kubernetes API only through this proxy
    # (HTTPS_PROXY), and ArgoCD waits for this Deployment to be healthy
    # before starting the next wave.
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-apiserver-proxy
  template:
    metadata:
      labels:
        app: kube-apiserver-proxy
        huemie-owner: core
        huemie.space/service-role: kube-apiserver-proxy
    spec:
      serviceAccountName: kube-apiserver-proxy
      containers:
        - name: kube-apiserver-connect-proxy
          image: ghcr.io/kaese72/kube-apiserver-connect-proxy:v0.0.1
          # HTTP CONNECT proxy, not a plain TCP relay: it never terminates TLS, so callers'
          # own ServiceAccount tokens and the apiserver's cert flow through untouched and
          # RBAC is enforced exactly as if they connected directly. It only ever tunnels to
          # the address it discovers via its own auto-injected KUBERNETES_SERVICE_HOST/PORT,
          # so this stays correct if the control plane ever moves, and it refuses to CONNECT
          # anywhere else.
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 50m
              memory: 32Mi
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: kube-apiserver-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  name: kube-apiserver-proxy
spec:
  ports:
    - port: 6443
      protocol: TCP
      targetPort: 8080
  selector:
    app: kube-apiserver-proxy
status:
  loadBalancer: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-apiserver-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  podSelector:
    matchLabels:
      huemie.space/service-role: kube-apiserver-proxy
  policyTypes:
    - Ingress
    - Egress
  # Egress is deliberately unrestricted (the allow-all rule at the bottom,
  # needed now that default-deny in ./network-policies.yaml covers every
  # pod): its outbound leg to the real apiserver hits the same
  # ClusterIP/DNAT-vs-NetworkPolicy problem this proxy exists to work
  # around, and there's no pod-backed target to restrict it to. Leaving
  # Egress open confines that exposure to this one small, single-purpose,
  # auditable component instead of every pod that needs API access.
  ingress:
    - from:
        - podSelector:
            matchLabels:
              huemie.space/service-role: authentication
        # cloud-connect-client's internal cloud-login listener calls the
        # TokenReview API (huemie-lib/k8sauth) to verify authentication's own
        # ServiceAccount, same pattern as authentication.
        - podSelector:
            matchLabels:
              huemie.space/service-role: cloud-connect-client
        # Every bootstrap Job's kubectl (HTTPS_PROXY) -- see
        # ./network-policies.yaml.
        - podSelector:
            matchLabels:
              huemie.space/purpose: bootstrap
      ports:
        - port: 8080
  egress:
    - {}
