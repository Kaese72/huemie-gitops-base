apiVersion: v1
kind: ServiceAccount
metadata:
  name: adapter-attendant
  annotations:
    argocd.argoproj.io/sync-wave: "50"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adapter-attendant
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: adapter-attendant
  template:
    metadata:
      labels:
        app: adapter-attendant
        huemie-owner: core
        huemie.space/service-role: adapter-attendant
    spec:
      serviceAccountName: adapter-attendant
      containers:
        - name: adapter-attendant
          image: ghcr.io/kaese72/adapter-attendant:v0.0.23
          ports:
            - containerPort: 8080
            - containerPort: 8081
          resources:
            limits:
              cpu: 250m
              memory: 256M
            requests:
              cpu: 100m
              memory: 256M
          env:
            # Only used to tell device-store an adapter's in-cluster address:
            # adapter-attendant never talks to the Kubernetes API. ArgoCD
            # deploys the adapters from its plugin answer.
            - name: KUBERNETES_ADAPTER_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: adapter-attendant-configmap
                  key: adapter.namespace
            - name: ADAPTERS_DEVICE_STORE_URL
              valueFrom:
                configMapKeyRef:
                  name: adapter-attendant-configmap
                  key: adapters.device-store-url
            - name: ADAPTERS_DEVICE_STORE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: device-ingest-jwt-secret
                  key: secret
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: adapter-attendant-configmap
                  key: database.host
            - name: DATABASE_USER
              valueFrom:
                configMapKeyRef:
                  name: adapter-attendant-configmap
                  key: database.user
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adapter-attendant-secret
                  key: database.password
            - name: AUTH_RSA_PUBLIC_KEY_PATH
              value: /etc/auth-pubkey/public.pem
            # Besides use tokens, API tokens are looked up on authentication's internal
            # listener, authenticated as this pod's own ServiceAccount
            # (allow-listed in authentication's main.go). Unset, only use
            # tokens are accepted.
            - name: "AUTH_INTERNAL_URL"
              valueFrom:
                configMapKeyRef:
                  name: adapter-attendant-configmap
                  key: authentication.internal-url
            - name: "AUTH_SERVICE_ACCOUNT_TOKEN_PATH"
              value: /var/run/secrets/tokens/authentication-internal
            # Written by adapter-attendant-plugin-token-bootstrap, together
            # with the copy in argocd the adapters ApplicationSet presents.
            - name: AUTH_PLUGIN_TOKENS
              valueFrom:
                secretKeyRef:
                  name: adapter-attendant-secret
                  key: auth.plugin-tokens
          volumeMounts:
            - name: auth-pubkey
              mountPath: /etc/auth-pubkey
              readOnly: true
            - name: authentication-internal-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
      volumes:
        - name: auth-pubkey
          secret:
            secretName: auth-rsa-verify-key
            items:
              - key: public.pem
                path: public.pem
        # Audience-bound token proving this pod's identity to
        # authentication's internal listener when introspecting an API
        # token. kubelet rotates it in place; usertoken.Introspector re-reads
        # it on every call.
        - name: authentication-internal-token
          projected:
            sources:
              - serviceAccountToken:
                  path: authentication-internal
                  audience: humi-authentication-internal
                  expirationSeconds: 3600
      # No Kubernetes API access at all, so no token either.
      automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: adapter-attendant-migrater
  labels:
    app: adapter-attendant-migrater
  annotations:
    argocd.argoproj.io/sync-wave: "40"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: adapter-attendant-migrater
        huemie.space/service-role: adapter-attendant
    spec:
      containers:
      - name: adapter-attendant-migrater
        image: ghcr.io/kaese72/adapter-attendant-migrater:v0.0.23
        imagePullPolicy: IfNotPresent
        args: ["-url=jdbc:mariadb://$(DATABASE_HOST):3306/adapterattendant?user=$(DATABASE_USER)&password=$(DATABASE_PASSWORD)", "migrate"]
        env:
          - name: "DATABASE_HOST"
            valueFrom:
              configMapKeyRef:
                name: adapter-attendant-configmap
                key: database.host
          - name: "DATABASE_USER"
            valueFrom:
              configMapKeyRef:
                name: adapter-attendant-configmap
                key: database.user
          - name: "DATABASE_PASSWORD"
            valueFrom:
              secretKeyRef:
                name: adapter-attendant-secret
                key: database.password
        resources:
            limits:
              cpu: 250m
              memory: 128M
            requests:
              cpu: 100m
              memory: 128M
      restartPolicy: Never
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: adapter-attendant
  annotations:
    argocd.argoproj.io/sync-wave: "60"
  name: adapter-attendant
spec:
  ports:
    - port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app: adapter-attendant
status:
  loadBalancer: {}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: adapter-attendant
  annotations:
    argocd.argoproj.io/sync-wave: "60"
  name: adapter-attendant-internal
spec:
  ports:
    - port: 8081
      protocol: TCP
      targetPort: 8081
  selector:
    app: adapter-attendant
status:
  loadBalancer: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: adapter-attendant
  annotations:
    argocd.argoproj.io/sync-wave: "55"
spec:
  podSelector:
    matchLabels:
      huemie.space/service-role: adapter-attendant
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
    - from:
        - podSelector:
            matchLabels:
              huemie.space/service-role: device-store
      ports:
        - port: 8081
    # The adapters ApplicationSet's Plugin generator.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
          podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-applicationset-controller
      ports:
        - port: 8081
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # API token introspection (authentication's internal listener).
    - to:
        - podSelector:
            matchLabels:
              huemie.space/service-role: authentication
      ports:
        - port: 8081
    - to:
        - podSelector:
            matchLabels:
              huemie.space/service-role: mariadb
      ports:
        - port: 3306
