apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-refresh-secret-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "10"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auth-refresh-secret-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "10"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["authentication-secret"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auth-refresh-secret-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "10"
subjects:
  - kind: ServiceAccount
    name: auth-refresh-secret-bootstrap
roleRef:
  kind: Role
  name: auth-refresh-secret-bootstrap
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: auth-refresh-secret-bootstrap
  labels:
    app: auth-refresh-secret-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: auth-refresh-secret-bootstrap
    spec:
      serviceAccountName: auth-refresh-secret-bootstrap
      containers:
        - name: create-secret
          image: alpine/k8s:1.37.0
          imagePullPolicy: IfNotPresent
          # Idempotent on the "auth.refresh-secret" key specifically (not
          # whole-secret existence): authentication-secret is shared with
          # mariadb-db-users-bootstrap, which owns "database.password" on
          # the same object and may run before or after this Job -- each
          # only ever touches its own key, patching it in if the secret
          # already exists, creating it fresh otherwise.
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
              SECRET_NAME=authentication-secret
              KEY=auth.refresh-secret

              EXISTING=$(kubectl get secret "$SECRET_NAME" -n "$NAMESPACE" -o jsonpath="{.data['$KEY']}" 2>/dev/null | base64 -d 2>/dev/null || true)
              if [ -n "$EXISTING" ]; then
                echo "auth refresh secret already provisioned, skipping"
                exit 0
              fi

              SECRET_VALUE=$(head -c 32 /dev/urandom | base64 | tr -d '\n')
              if kubectl get secret "$SECRET_NAME" -n "$NAMESPACE" >/dev/null 2>&1; then
                ENC=$(printf '%s' "$SECRET_VALUE" | base64 | tr -d '\n')
                kubectl patch secret "$SECRET_NAME" -n "$NAMESPACE" --type=merge -p "{\"data\":{\"$KEY\":\"$ENC\"}}"
              else
                kubectl create secret generic "$SECRET_NAME" -n "$NAMESPACE" --from-literal="$KEY=$SECRET_VALUE"
              fi
          resources:
            limits:
              cpu: 100m
              memory: 32M
            requests:
              cpu: 20m
              memory: 16M
      restartPolicy: Never
