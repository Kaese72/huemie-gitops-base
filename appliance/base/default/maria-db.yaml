---
apiVersion: v1
data:
  my.cnf: "[mysqld]\r\nbind-address = 0.0.0.0"
kind: ConfigMap
metadata:
  name: mariadb-config
# mariadb-root-password-bootstrap (this directory) generates the root password
# and is waved to run before the Deployment below ever starts (see its
# sync-wave). mariadb-db-users-bootstrap (same file) connects to the live
# server afterwards and runs CREATE USER/GRANT for each consuming service,
# every sync.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-pv-claim
  labels:
    app: mariadb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb-deployment
  annotations:
    # Must start after mariadb-root-password-bootstrap (this directory, wave
    # 20), since mariadb-root-password is generated by that Job rather than
    # defined statically here. mariadb-db-users-bootstrap (same directory)
    # is waved to run *after* this instead (wave 32) -- it connects to the
    # live server rather than seeding it at first boot.
    argocd.argoproj.io/sync-wave: "30"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
        huemie.space/service-role: mariadb
    spec:
      containers:
      - name: mariadb
        # Pinned to match the version this instance's PVC was originally
        # initialized with (11.7.2). Was previously `mariadb:latest`, which
        # silently drifted to 12.3.2 and broke every database on this
        # instance until `mariadb-upgrade` was run by hand -- don't move
        # this forward without also running `mariadb-upgrade` against the
        # live pod (or accepting a PVC wipe) as part of the same change.
        image: mariadb:13.0.2
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: config-volume
          mountPath: /etc/mysql/conf.d/
        - name: mariadb-pv
          mountPath: /var/lib/mysql
        env:
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-root-password
              key: password
        resources:
          limits:
            cpu: 1000m
            memory: 512M
          requests:
            cpu: 500m
            memory: 512M
      volumes:
      - name: config-volume
        configMap:
          name: mariadb-config
      - name: mariadb-pv
        persistentVolumeClaim:
          claimName: mariadb-pv-claim
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: mariadb
  name: mariadb
spec:
  ports:
    - port: 3306
      protocol: TCP
      targetPort: 3306
  selector:
    app: mariadb
status:
  loadBalancer: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb
spec:
  podSelector:
    matchLabels:
      huemie.space/service-role: mariadb
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              huemie.space/service-role: device-store
      ports:
        - port: 3306
    - from:
        - podSelector:
            matchLabels:
              huemie.space/service-role: adapter-attendant
      ports:
        - port: 3306
    - from:
        - podSelector:
            matchLabels:
              huemie.space/service-role: authentication
      ports:
        - port: 3306
    - from:
        - podSelector:
            matchLabels:
              huemie.space/service-role: ittt-orchestrator
      ports:
        - port: 3306
    - from:
        - podSelector:
            matchLabels:
              huemie.space/service-role: chatbot
      ports:
        - port: 3306
    - from:
        - podSelector:
            matchLabels:
              huemie.space/service-role: cloud-connect-client
      ports:
        - port: 3306
    # mariadb-db-users-bootstrap (this directory) connects as root to
    # create/grant each service's MariaDB user on every sync.
    - from:
        - podSelector:
            matchLabels:
              huemie.space/service-role: mariadb-db-users-bootstrap
      ports:
        - port: 3306
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
