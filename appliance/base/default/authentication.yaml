apiVersion: v1
kind: ServiceAccount
metadata:
  name: authentication
  annotations:
    argocd.argoproj.io/sync-wave: "50"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentication
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentication
  template:
    metadata:
      labels:
        app: authentication
        huemie-owner: core
        huemie.space/service-role: authentication
    spec:
      serviceAccountName: authentication
      containers:
        - name: authentication
          image: ghcr.io/kaese72/authentication:v0.0.7
          env:
            # NetworkPolicy can't reliably restrict egress straight to the
            # apiserver's ClusterIP (kube-proxy's DNAT to the real backend
            # happens before NetworkPolicy is enforced), so route the
            # Kubernetes client's TokenReview traffic through
            # kube-apiserver-proxy - a real pod, reachable with a
            # reliably-enforceable podSelector egress rule below.
            # KUBERNETES_SERVICE_HOST/PORT are left at their normal
            # auto-injected values since this is a transparent HTTP CONNECT
            # proxy: the client still dials and TLS-verifies the real
            # apiserver address, it just tunnels through the proxy pod to
            # get there. Deliberately NOT the generic HTTPS_PROXY env var:
            # this process also calls out to the cloud directly (Humi Cloud
            # login), and a blanket HTTPS_PROXY would silently route that
            # traffic through this apiserver-only proxy too, which refuses to
            # CONNECT anywhere else - see huemie-lib/k8sauth.NewInClusterClientset.
            - name: KUBERNETES_APISERVER_PROXY_URL
              value: http://kube-apiserver-proxy:6443
            - name: "DATABASE_HOST"
              valueFrom:
                configMapKeyRef:
                  name: authentication-configmap
                  key: database.host
            - name: "DATABASE_USER"
              valueFrom:
                configMapKeyRef:
                  name: authentication-configmap
                  key: database.user
            - name: "DATABASE_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: authentication-secret
                  key: database.password
            - name: "AUTH_REFRESH_SECRET"
              valueFrom:
                secretKeyRef:
                  name: authentication-secret
                  key: auth.refresh-secret
            - name: "AUTH_RSA_PRIVATE_KEY_PATH"
              value: /etc/authentication/private.pem
            # "Log in with Humi Cloud" goes through cloud-connect-client's
            # internal listener, authenticated as this pod's own Kubernetes
            # ServiceAccount (see the projected-token volume below) --
            # verified there via TokenReview, the same mechanism chatbot
            # uses against this service's own internal listener. No static
            # shared secret.
            - name: "CLOUD_CONNECT_CLIENT_URL"
              valueFrom:
                configMapKeyRef:
                  name: authentication-configmap
                  key: cloud.connect-client-url
            - name: "CLOUD_SERVICE_ACCOUNT_TOKEN_PATH"
              value: /var/run/secrets/tokens/cloud-connect-client-internal
            # Internal listener (port 8081): only the chatbot's own
            # Kubernetes ServiceAccount, verified via TokenReview
            # (huemie-lib/k8sauth), may mint an impersonation token here --
            # that allow-list is hardcoded in authentication's main.go, not
            # configuration, since it's a security boundary of the service.
            - name: "INTERNAL_LISTEN_ADDR"
              value: ":8081"
            - name: "INTERNAL_TOKEN_AUDIENCE"
              valueFrom:
                configMapKeyRef:
                  name: authentication-configmap
                  key: internal.token-audience
          volumeMounts:
            - name: rsa-key
              mountPath: /etc/authentication
              readOnly: true
            - name: cloud-connect-client-internal-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
          ports:
            - containerPort: 8080
            - containerPort: 8081
          resources:
            limits:
              cpu: 500m
              memory: 128M
            requests:
              cpu: 100m
              memory: 128M
      volumes:
        - name: rsa-key
          secret:
            secretName: auth-rsa-signing-key
            items:
              - key: private.pem
                path: private.pem
        # Audience-bound token proving this pod's identity to
        # cloud-connect-client's internal listener (see
        # huemie-lib/k8sauth on that side). kubelet rotates its contents in
        # place well before expirationSeconds, which
        # internal/cloudclient.httpClient.do relies on by re-reading the
        # file fresh on every call rather than caching it. Audience must
        # match cloud-connect-client's internal.token-audience default
        # ("humi-cloud-connect-client-internal").
        - name: cloud-connect-client-internal-token
          projected:
            sources:
              - serviceAccountToken:
                  path: cloud-connect-client-internal
                  audience: humi-cloud-connect-client-internal
                  expirationSeconds: 3600
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: authentication-tokenreview
  annotations:
    argocd.argoproj.io/sync-wave: "50"
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: authentication-tokenreview
  annotations:
    argocd.argoproj.io/sync-wave: "50"
subjects:
  - kind: ServiceAccount
    name: authentication
    namespace: default
roleRef:
  kind: ClusterRole
  name: authentication-tokenreview
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: authentication-migrater
  labels:
    app: authentication-migrater
  annotations:
    argocd.argoproj.io/sync-wave: "40"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: authentication-migrater
        huemie.space/service-role: authentication
    spec:
      containers:
      - name: authentication-migrater
        image: ghcr.io/kaese72/authentication-migrater:v0.0.7
        imagePullPolicy: IfNotPresent
        args: ["-url=jdbc:mariadb://$(DATABASE_HOST):3306/authentication?user=$(DATABASE_USER)&password=$(DATABASE_PASSWORD)", "migrate"]
        env:
          - name: "DATABASE_HOST"
            valueFrom:
              configMapKeyRef:
                name: authentication-configmap
                key: database.host
          - name: "DATABASE_USER"
            valueFrom:
              configMapKeyRef:
                name: authentication-configmap
                key: database.user
          - name: "DATABASE_PASSWORD"
            valueFrom:
              secretKeyRef:
                name: authentication-secret
                key: database.password
        resources:
          limits:
            cpu: 250m
            memory: 128M
          requests:
            cpu: 100m
            memory: 128M
      restartPolicy: Never
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: authentication
  annotations:
    argocd.argoproj.io/sync-wave: "60"
  name: authentication
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
    # Internal-only listener: a trusted caller's own Kubernetes
    # ServiceAccount token in, an impersonation use-token out. Never routed
    # by the ingress (which only targets the Service's "http" port).
    - name: internal
      port: 8081
      protocol: TCP
      targetPort: 8081
  selector:
    app: authentication
status:
  loadBalancer: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentication
  annotations:
    argocd.argoproj.io/sync-wave: "55"
spec:
  podSelector:
    matchLabels:
      huemie.space/service-role: authentication
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
    - from:
        - podSelector:
            matchLabels:
              huemie.space/service-role: chatbot
      ports:
        - port: 8080
        # Internal listener (see the Service): only chatbot is allow-listed
        # in authentication's main.go, but that's an application-layer
        # check, not a network one -- this still scopes who can reach the
        # port at all.
        - port: 8081
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              huemie.space/service-role: mariadb
      ports:
        - port: 3306
    - to:
        - podSelector:
            matchLabels:
              huemie.space/service-role: cloud-connect-client
      ports:
        - port: 8081
    # The Kubernetes API server, for the TokenReview calls
    # huemie-lib/k8sauth makes to verify a caller's ServiceAccount token.
    # k3s's apiserver sits behind a ClusterIP, and kube-proxy's DNAT to the
    # real backend happens before NetworkPolicy is enforced, so an ipBlock
    # on that ClusterIP can't be relied on to actually restrict anything -
    # same problem adapter-attendant and appliance-registry already solved.
    # Route through kube-apiserver-proxy instead (see
    # ./kube-apiserver-proxy.yaml and the KUBERNETES_APISERVER_PROXY_URL env
    # var above), a real pod with a reliably-enforceable podSelector egress
    # rule.
    - to:
        - podSelector:
            matchLabels:
              huemie.space/service-role: kube-apiserver-proxy
      ports:
        - port: 8080
