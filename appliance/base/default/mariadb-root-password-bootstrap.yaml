apiVersion: v1
kind: ServiceAccount
metadata:
  name: mariadb-root-password-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "10"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mariadb-root-password-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "10"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["mariadb-root-password"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mariadb-root-password-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "10"
subjects:
  - kind: ServiceAccount
    name: mariadb-root-password-bootstrap
roleRef:
  kind: Role
  name: mariadb-root-password-bootstrap
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mariadb-root-password-bootstrap
  labels:
    app: mariadb-root-password-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: mariadb-root-password-bootstrap
    spec:
      serviceAccountName: mariadb-root-password-bootstrap
      containers:
        - name: create-secret
          image: alpine/k8s:1.37.0
          imagePullPolicy: IfNotPresent
          # Idempotent: if the mariadb root password secret already exists, does nothing.
          # mariadb-deployment (maria-db.yaml) reads it as MARIADB_ROOT_PASSWORD and is
          # waved to start after this Job, since it only takes effect against a brand-new
          # PVC anyway.
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
              NEW_SECRET=mariadb-root-password
              NEW_KEY=password

              if kubectl get secret "$NEW_SECRET" -n "$NAMESPACE" >/dev/null 2>&1; then
                echo "mariadb root password already provisioned, skipping"
                exit 0
              fi

              SECRET_VALUE=$(head -c 32 /dev/urandom | base64 | tr -d '\n')
              kubectl create secret generic "$NEW_SECRET" -n "$NAMESPACE" --from-literal="$NEW_KEY=$SECRET_VALUE"
          resources:
            limits:
              cpu: 100m
              memory: 32M
            requests:
              cpu: 20m
              memory: 16M
      restartPolicy: Never
