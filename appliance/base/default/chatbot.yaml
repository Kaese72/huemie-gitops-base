apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  # Neither the Anthropic API key nor the device-store credential is
  # deploy-time config: the Anthropic key is configured at runtime via the
  # /chatbot-service/v0/api-keys endpoints, and the device-store credential
  # is a self-provisioned identity set up via POST
  # /chatbot-service/v0/identities/setup (see internal/identity and the
  # README's architecture note on this mechanism).
  replicas: 2
  selector:
    matchLabels:
      app: chatbot
  template:
    metadata:
      labels:
        app: chatbot
        huemie-owner: core
        huemie.space/service-role: chatbot
    spec:
      containers:
        - name: chatbot
          image: ghcr.io/kaese72/chatbot:v0.0.1
          env:
            - name: "DATABASE_HOST"
              valueFrom:
                configMapKeyRef:
                  name: chatbot-configmap
                  key: database.host
            - name: "DATABASE_USER"
              valueFrom:
                configMapKeyRef:
                  name: chatbot-configmap
                  key: database.user
            - name: "DATABASE_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: chatbot-secret
                  key: database.password
            - name: "EVENT_CONNECTIONSTRING"
              valueFrom:
                secretKeyRef:
                  name: chatbot-secret
                  key: event.connectionstring
            - name: "DEVICE_STORE_URL"
              valueFrom:
                configMapKeyRef:
                  name: chatbot-configmap
                  key: device-store.url
            - name: "ANTHROPIC_MODEL"
              valueFrom:
                configMapKeyRef:
                  name: chatbot-configmap
                  key: anthropic.model
            - name: "AUTHENTICATION_URL"
              valueFrom:
                configMapKeyRef:
                  name: chatbot-configmap
                  key: authentication.url
            - name: AUTH_RSA_PUBLIC_KEY_PATH
              value: /etc/auth-pubkey/public.pem
          volumeMounts:
            - name: auth-pubkey
              mountPath: /etc/auth-pubkey
              readOnly: true
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 500m
              memory: 256M
            requests:
              cpu: 100m
              memory: 256M
      volumes:
        - name: auth-pubkey
          secret:
            secretName: auth-rsa-verify-key
            items:
              - key: public.pem
                path: public.pem
---
apiVersion: batch/v1
kind: Job
metadata:
  name: chatbot-migrater
  labels:
    app: chatbot-migrater
  annotations:
    argocd.argoproj.io/sync-wave: "40"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: chatbot-migrater
        huemie.space/service-role: chatbot
    spec:
      containers:
        - name: chatbot-migrater
          image: ghcr.io/kaese72/chatbot-migrater:v0.0.1
          imagePullPolicy: IfNotPresent
          args: ["-url=jdbc:mariadb://$(DATABASE_HOST):3306/chatbot?user=$(DATABASE_USER)&password=$(DATABASE_PASSWORD)", "migrate"]
          env:
            - name: "DATABASE_HOST"
              valueFrom:
                configMapKeyRef:
                  name: chatbot-configmap
                  key: database.host
            - name: "DATABASE_USER"
              valueFrom:
                configMapKeyRef:
                  name: chatbot-configmap
                  key: database.user
            - name: "DATABASE_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: chatbot-secret
                  key: database.password
          resources:
            limits:
              cpu: 250m
              memory: 128M
            requests:
              cpu: 100m
              memory: 128M
      restartPolicy: Never
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: chatbot
  annotations:
    argocd.argoproj.io/sync-wave: "60"
  name: chatbot
spec:
  ports:
    - port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app: chatbot
status:
  loadBalancer: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chatbot
  annotations:
    argocd.argoproj.io/sync-wave: "55"
spec:
  podSelector:
    matchLabels:
      huemie.space/service-role: chatbot
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              huemie.space/service-role: device-store
      ports:
        - port: 8080
    - to:
        - podSelector:
            matchLabels:
              huemie.space/service-role: authentication
      ports:
        - port: 8080
    - to:
        - podSelector:
            matchLabels:
              huemie.space/service-role: mariadb
      ports:
        - port: 3306
    - to:
        - podSelector:
            matchLabels:
              huemie.space/service-role: rabbitmq
      ports:
        - port: 5672
    # Outbound to the LLM provider (Anthropic Messages API), same shape as
    # the adapters' egress rule for reaching external device hubs: allow
    # everywhere except the cluster's own pod/service CIDRs, rather than
    # pinning to Anthropic's IP ranges, which aren't published/stable.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16
              - 10.43.0.0/16
