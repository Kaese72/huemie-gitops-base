apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: humi
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kaese72/huemie-gitops-base.git
    targetRevision: master
    path: appliance/envs/appliance
  destination:
    server: https://kubernetes.default.svc
    namespace: huemie-local
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # No CreateNamespace=true -- base/default/namespace.yaml and
    # base/adapters/namespace.yaml commit the Namespace objects themselves.
