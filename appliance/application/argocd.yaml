apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kaese72/huemie-gitops-base.git
    targetRevision: master
    path: appliance/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # ArgoCD's own CRDs are too large for client-side apply's
      # last-applied-configuration annotation.
      - ServerSideApply=true
