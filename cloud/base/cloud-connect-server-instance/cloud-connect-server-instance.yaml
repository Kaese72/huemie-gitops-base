# Per-appliance template, instantiated once per active Appliance by
# cloud/application-crds/applicationset-cloud-connect-server-fleet.yaml -
# see that file and appliance-registry's README ("Cloud-side
# cloud-connect-server provisioning") for the full mechanism.
#
# Every value below that needs to differ per appliance is deliberately left
# as an obvious placeholder ("unset" / "placeholder...") rather than a real
# default, and is JSON6902-patched by the ApplicationSet template. If you
# ever see one of these placeholders on a live object, the patch didn't
# apply - it's not a fallback that's silently working.
#
# Unlike cloud/base/cloud-connect-server (the original single-tenant
# manifest, still deployed as-is for the one appliance that predates this
# fleet mechanism), every resource here is deployed once per appliance into
# the *same* huemie-cloud namespace, so metadata.name is disambiguated by
# the ApplicationSet's nameSuffix ("-<id>") and pod selection is
# disambiguated by the "applianceId" label, patched onto every
# selector/podSelector/template-label location below in lockstep - not by
# nameSuffix or Kustomize's commonLabels transformer, since neither is
# guaranteed to reach every one of those fields consistently.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-connect-server
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-connect-server
      applianceId: "unset"
  template:
    metadata:
      labels:
        app: cloud-connect-server
        applianceId: "unset"
        huemie-owner: core
        huemie.space/service-role: cloud-connect-server
    spec:
      containers:
        - name: cloud-connect-server
          image: ghcr.io/kaese72/cloud-connect-server:v0.0.5
          env:
            # index 0 - CLOUD_CONNECT_INTERNAL_HOST is intentionally NOT
            # patched per instance: it's the fixed internal ingress
            # hostname convention every appliance cluster resolves
            # locally (see cloud-connect's README's "Host header flow"),
            # not an appliance-specific value, so every instance shares
            # this one ConfigMap. See ../../envs/hallen/kustomization.yaml
            # for why it's safe to reference by this unhashed literal name
            # from a kustomize build that doesn't generate it itself.
            - name: CLOUD_CONNECT_INTERNAL_HOST
              valueFrom:
                configMapKeyRef:
                  name: cloud-connect-configmap
                  key: internal.host
            # index 1 - patched to cloud-connect-secret-<id>, the Secret
            # appliance-registry writes directly (never templated here -
            # see its README).
            - name: CLOUD_CONNECT_AUTH
              valueFrom:
                secretKeyRef:
                  name: cloud-connect-secret
                  key: auth
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 250m
              memory: 64M
            requests:
              cpu: 50m
              memory: 64M
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-connect-server
  labels:
    app: cloud-connect-server
  annotations:
    argocd.argoproj.io/sync-wave: "60"
spec:
  ports:
    - port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app: cloud-connect-server
    applianceId: "unset"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-connect-ingress
  labels:
    app: cloud-connect-server
  annotations:
    argocd.argoproj.io/sync-wave: "70"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: huemie-cloud-redirect-https@kubernetescrd
spec:
  rules:
    - host: placeholder.appliance.humi.kaese.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloud-connect-server
                port:
                  number: 8080
  tls:
    - hosts:
        - placeholder.appliance.humi.kaese.space
      secretName: letsencrypt-prod
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloud-connect-server
  annotations:
    argocd.argoproj.io/sync-wave: "55"
spec:
  podSelector:
    matchLabels:
      app: cloud-connect-server
      applianceId: "unset"
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Both tunnel-establishment traffic (wss://<hostname>/cloud-connect/v0/tunnel)
    # and ordinary proxied user traffic arrive the same way: through the single
    # public Ingress object above, via traefik - there is no separate path a
    # legitimate tunnel client uses to reach this pod directly. Scoped to just
    # traefik rather than left open to any pod in the cluster - open ingress
    # here would let any other compromised pod in "hallen" attempt the chisel
    # handshake directly against any appliance's tunnel, bypassing the public
    # ingress and its access logs, for every appliance this template stamps out.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
