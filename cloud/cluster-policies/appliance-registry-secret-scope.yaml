# Closes a gap native RBAC can't: ../base/appliance-registry's Role grants
# appliance-registry's ServiceAccount get/create/update/patch/delete on
# *all* Secrets in huemie-cloud, because RBAC can restrict those verbs to an
# enumerated resourceNames list but not to a name *pattern*, and can't
# restrict create by name at all - so there's no Role that says "only
# cloud-connect-secret-<id>" for Secrets created dynamically at runtime.
#
# Without this, a compromised appliance-registry pod (a dependency CVE, a
# bug in its own handler code, anything giving an attacker use of this
# ServiceAccount's token) could read or overwrite *any* Secret in
# huemie-cloud - including cloud-user-registry-rsa-signing-key, the private
# key that signs every use JWT in the entire cloud system. This policy
# makes that a hard no at the API server regardless of what the Go code
# does or how it's compromised: this ServiceAccount may only touch Secrets
# named cloud-connect-secret-*, full stop.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: appliance-registry-secret-scope
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets"]
  matchConditions:
    - name: only-appliance-registry-serviceaccount
      expression: >-
        request.userInfo.username == "system:serviceaccount:huemie-cloud:appliance-registry"
  validations:
    - expression: >-
        (object != null ? object : oldObject).metadata.name.startsWith("cloud-connect-secret-")
      message: "appliance-registry's ServiceAccount may only manage Secrets named cloud-connect-secret-<id>"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: appliance-registry-secret-scope-binding
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  policyName: appliance-registry-secret-scope
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: huemie-cloud
