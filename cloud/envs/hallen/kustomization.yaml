apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: huemie-cloud

configMapGenerator:
- name: cloud-connect-configmap
  literals:
    # The Host header value cloud nginx sets on all proxied traffic so the
    # appliance-side ingress can route it. Must match an ingress rule hostname
    # on the appliance cluster.
    - internal.host=app.huemie.local

# cloud-connect-configmap needs a stable, unhashed name: it's read not just
# by ../../base/cloud-connect-server (built together with it, in this same
# kustomization, where kustomize's automatic name-reference rewriting would
# handle a hashed name fine) but also by every per-appliance
# cloud-connect-server-<id> Deployment the cloud-connect-server-fleet
# ApplicationSet generates from ../../base/cloud-connect-server-instance -
# each of those is built as its own separate, unrelated kustomize run that
# has no visibility into this generator, so it can only reference this
# ConfigMap by a name it can predict ahead of time.
generatorOptions:
  disableNameSuffixHash: true

resources:
  - namespace.yaml
  - ../../base/cloud-connect-server
  - ../../base/cloud-user-registry
  - ../../base/appliance-registry
  - ../../base/kube-apiserver-proxy
  - ../../base/cloud-ui
  - ../../base/ingress

# No configMapGenerator/secretGenerator for cloud-user-registry's database
# credentials here -- MariaDB is operator-managed (see hallen-gitops-base)
# and cloud-user-registry provisions its own database/user via CRs, the
# same pattern riskie-gitops-base uses for its services. Its database
# password and signing keypair are provisioned out of band instead of via
# an in-cluster bootstrap Job -- see base/cloud-user-registry/README.md.
