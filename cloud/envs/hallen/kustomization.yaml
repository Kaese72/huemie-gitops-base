apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: huemie-cloud

configMapGenerator:
- name: cloud-connect-configmap
  literals:
    # The Host header value cloud nginx sets on all proxied traffic so the
    # appliance-side ingress can route it. Must match an ingress rule hostname
    # on the appliance cluster.
    - internal.host=app.huemie.local

resources:
  - namespace.yaml
  - ../../base/cloud-connect-server
  - ../../base/cloud-user-registry

# No configMapGenerator/secretGenerator for cloud-user-registry's database
# credentials or signing keys here -- MariaDB is operator-managed (see
# hallen-gitops-base) and cloud-user-registry provisions its own
# database/user via CRs plus its own secret/keypair bootstrap Jobs defined
# alongside it in base/cloud-user-registry, the same pattern
# riskie-gitops-base uses for its services.
